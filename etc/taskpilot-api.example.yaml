Name: taskpilot-api
Host: 0.0.0.0
Port: 8888
Mode: debug

Database:
  DataSource: "postgres://taskpilot:taskpilot@localhost:5432/taskpilot?sslmode=disable"

Cache:
  Host: "localhost:6379"
  Pass: ""
  Type: "node"

Auth:
  AccessSecret: "taskpilot-local-dev-secret-change-me"
  AccessExpire: 900
  RefreshExpire: 2592000
  CookieSecure: false

CORS:
  AllowedOrigins:
    - "http://localhost:5173"
    - "http://localhost:5174"
    - "https://dev.taskpilot.1kuansi.cn"
    - "https://taskpilot.1kuansi.cn"

AI:
  BaseURL: "https://ai.soruxgpt.com/v1"
  APIKey: ""
  Model: "gpt-5.4"
  RequestTimeout: 180
  MaxOutputTokens: 8000

Upload:
  Root: "uploads"
  MaxFileBytes: 10485760
  MaxPages: 50
  MaxTextChars: 50000
  MinEffectiveChars: 20
  ExtractTimeout: 15
  MaxConcurrentExtractions: 2
  SlotWaitTimeout: 3
  TempGrace: 3600
  OrphanGrace: 86400
  CleanupInterval: 86400

Worker:
  StreamKey: "taskpilot:queue:parse_jobs"
  ConsumerGroup: "taskpilot:parse_workers"
  Concurrency: 2
  BlockTimeout: 5
  ReconcileInterval: 30
  PendingGrace: 30
  LeaseTimeout: 600
  MaxRecoveries: 3
  StreamRetention: 604800
  HeartbeatInterval: 10
  HeartbeatTTL: 30
  ShutdownGrace: 180
