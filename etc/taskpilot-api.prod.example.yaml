Name: taskpilot-api
Host: 0.0.0.0
Port: 8888
Mode: release

Database:
  DataSource: ""

Cache:
  Host: ""
  Pass: ""
  Type: "node"

Auth:
  AccessSecret: ""
  AccessExpire: 900
  RefreshExpire: 2592000
  CookieSecure: true

CORS:
  AllowedOrigins:
    - "https://dev.taskpilot.1kuansi.cn"
    - "https://taskpilot.1kuansi.cn"

AI:
  BaseURL: "https://ai.soruxgpt.com/v1"
  APIKey: ""
  Model: "gpt-5.4"
  RequestTimeout: 180
  MaxOutputTokens: 8000

Worker:
  StreamKey: "taskpilot:queue:parse_jobs"
  ConsumerGroup: "taskpilot:parse_workers"
  Concurrency: 2
  BlockTimeout: 5
  ReconcileInterval: 30
  PendingGrace: 30
  LeaseTimeout: 600
  MaxRecoveries: 3
  StreamRetention: 604800
  HeartbeatInterval: 10
  HeartbeatTTL: 30
  ShutdownGrace: 180
