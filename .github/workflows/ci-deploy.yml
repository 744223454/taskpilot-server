name: CI and Deploy

on:
  push:
    branches:
      - main
      - dev
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: taskpilot
          POSTGRES_USER: taskpilot
          POSTGRES_PASSWORD: taskpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskpilot -d taskpilot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Install Poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils postgresql-client

      - name: Run unit tests
        run: make test

      - name: Run PostgreSQL integration tests
        env:
          TASKPILOT_TEST_DATABASE_DSN: postgres://taskpilot:taskpilot@localhost:5432/taskpilot?sslmode=disable
        run: go test ./internal/logic -run '^TestIntegration' -count=1

      - name: Build API and Worker
        run: make build

      - name: Initialize smoke-test database
        env:
          PGPASSWORD: taskpilot
        run: psql -v ON_ERROR_STOP=1 -h localhost -U taskpilot -d taskpilot < scripts/migrate.sql

      - name: Run process smoke tests
        env:
          TASKPILOT_DATABASE_DSN: postgres://taskpilot:taskpilot@localhost:5432/taskpilot?sslmode=disable
          TASKPILOT_REDIS_HOST: localhost:6379
          TASKPILOT_AUTH_ACCESS_SECRET: taskpilot-ci-smoke-secret
          TASKPILOT_AUTH_ACCESS_EXPIRE: 900
          TASKPILOT_AUTH_REFRESH_EXPIRE: 3600
          TASKPILOT_AUTH_COOKIE_SECURE: "false"
          TASKPILOT_AI_BASE_URL: http://127.0.0.1:9/v1
          TASKPILOT_AI_API_KEY: taskpilot-ci-placeholder
          TASKPILOT_AI_MODEL: taskpilot-ci-placeholder
          TASKPILOT_WORKER_HEARTBEAT_INTERVAL: 1
          TASKPILOT_WORKER_HEARTBEAT_TTL: 5
        run: bash scripts/ci_smoke_test.sh

  deploy-production:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=0
          for secret_name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Missing required Actions secret: ${secret_name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
        shell: bash

      - name: Prepare SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
        shell: bash

      - name: Deploy on production server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" '
            cd "'"$DEPLOY_PATH"'" &&
            git switch main &&
            git pull --ff-only origin main &&
            chmod +x scripts/deploy_prod.sh &&
            ./scripts/deploy_prod.sh
          '
        shell: bash

  deploy-development:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEV_DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=0
          for secret_name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEV_DEPLOY_PATH DEPLOY_SSH_KEY; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Missing required Actions secret: ${secret_name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
        shell: bash

      - name: Prepare SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
        shell: bash

      - name: Deploy on development server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEV_DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" '
            cd "'"$DEV_DEPLOY_PATH"'" &&
            git restore -- scripts/deploy_dev.sh &&
            git switch dev &&
            git pull --ff-only origin dev &&
            sh ./scripts/deploy_dev.sh
          '
        shell: bash
