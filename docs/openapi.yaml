        "503":
          description: 数据库未连接
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      tags: [Projects]
      summary: 将解析结果保存为项目
      description: |
        读取当前用户已确认的解析结果，在同一数据库事务内创建项目，并将 `generated_tasks` 快照展开为初始任务。

        同一解析结果只能创建一个项目。首次创建返回 201；重复或并发请求返回首次创建的项目和任务，状态码为 200，且不会使用重复请求中的新名称覆盖已有项目。
      operationId: createProject
      security:
        - bearerAuth: []
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
            examples:
              default:
                value:
                  parse_result_id: 9001
                  name: 创新创业比赛报名项目
      responses:
        "201":
          description: 首次创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateProjectEnvelope"
        "200":
          description: 该解析结果已创建项目，幂等返回已有项目及任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateProjectEnvelope"
        "400":
          description: 请求参数无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: 解析结果不存在或不属于当前用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: 该解析结果已关联一个已删除项目，不能再次创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: 解析结果未确认，或任务快照无法生成合法任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: 数据库未连接
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
