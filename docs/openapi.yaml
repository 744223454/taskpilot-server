          description: 任务或所属项目不存在、已删除或不属于当前用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: 项目已归档或 version 冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      tags: [Tasks]
      summary: 物理删除任务
      operationId: deleteTask
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyEnvelope"
        "404":
          description: 任务不存在或不属于当前用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: 所属项目已归档
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/tasks/{taskId}/status:
    patch:
      tags: [Tasks]
      summary: 更新任务状态
      description: todo、doing、done 可任意切换；重复设置同一状态幂等返回当前任务。
      operationId: updateTaskStatus
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskStatusRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskEnvelope"
        "404":
          description: 任务不存在或不属于当前用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: 所属项目已归档
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/tasks/reorder:
    post:
      tags: [Tasks]
      summary: 重新排列项目全部任务
      description: 必须提交项目当前完整任务 ID 集合；事务内锁定项目并重新写入连续 sort_order。
      operationId: reorderTasks
      security:
        - bearerAuth: []
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderTasksRequest"
      responses:
        "200":
          description: 排序成功，返回完整任务列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListEnvelope"
        "404":
          description: 项目不存在、已删除或不属于当前用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: 项目已归档或任务集合与数据库不一致
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/history/projects:
    get:
      tags: [History]
      summary: 查询项目历史
      description: 包含 active、archived、deleted；不传 status 时返回全部状态。
      operationId: listProjectHistory
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema:
            type: string
            enum: [active, archived, deleted]
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListEnvelope"
  /api/v1/history/projects/{projectId}:
    get:
      tags: [History]
      summary: 查询历史项目详情
      operationId: getProjectHistory
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEnvelope"
        "404":
          description: 项目不存在或不属于当前用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/history/projects/{projectId}/tasks:
    get:
      tags: [History]
      summary: 查询历史项目任务
      operationId: listProjectTaskHistory
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: status
          in: query
          schema:
            type: string
            enum: [todo, doing, done]
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListEnvelope"
        "404":
          description: 项目不存在或不属于当前用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/history/parse-results:
    get:
      tags: [History]
      summary: 查询解析结果历史
      operationId: listParseResultHistory
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseResultListEnvelope"
components:
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: 必须与浏览器中的 `csrf_token` Cookie 原值一致。
      schema:
        type: string
    ResultId:
      name: resultId
      in: path
      required: true
      description: 解析结果 ID
      schema:
        type: integer
        format: int64
        minimum: 1
    ProjectId:
      name: projectId
      in: path
      required: true
      description: 项目 ID
      schema:
        type: integer
        format: int64
        minimum: 1
    TaskId:
      name: taskId
      in: path
      required: true
      description: 任务 ID
      schema:
        type: integer
        format: int64
        minimum: 1
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    accessCookie:
      type: apiKey
      in: cookie
      name: access_token
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
  schemas:
    Envelope:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: ok
    ErrorEnvelope:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 10002
        message:
          type: string
          example: invalid access token
        data:
          type: object
          nullable: true
          example: null
    EmptyEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required:
            - data
          properties:
            data:
              type: object
              nullable: true
              example: null
    HealthPayload:
      type: object
      required:
        - status
        - db
        - redis
        - worker
      properties:
        status:
          type: string
          example: ok
        db:
          type: boolean
          example: true
        redis:
          type: boolean
          example: true
        worker:
          type: boolean
          example: true
    HealthEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required:
            - data
          properties:
            data:
              $ref: "#/components/schemas/HealthPayload"
    HelloResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: hello zmk
    HelloEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required:
            - data
          properties:
            data:
              $ref: "#/components/schemas/HelloResponse"
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - nickname
      properties:
        email:
          type: string
          format: email
          example: test@example.com
        password:
          type: string
          minLength: 8
          example: "12345678"
        nickname:
          type: string
          minLength: 1
          maxLength: 64
          example: zmk
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: seed.dev01@taskpilot.1kuansi.cn
        password:
          type: string
          minLength: 8
          example: "TP-12ddf1c35b9c480a21cc9df5"
    UserProfile:
      type: object
      required:
        - id
        - email
        - nickname
      properties:
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: test@example.com
        nickname:
          type: string
          example: zmk
        avatar_url:
          type: string
          nullable: true
          example: null
    AuthResponse:
      type: object
      required:
        - user
        - access_token
        - expires_in_sec
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
        expires_in_sec:
          type: integer
          format: int64
          example: 900
    AuthEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required:
            - data
          properties:
            data:
              $ref: "#/components/schemas/AuthResponse"
    UserProfileEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required:
            - data
          properties:
            data:
              $ref: "#/components/schemas/UserProfile"
    CreateTextDocumentRequest:
      type: object
      required: [title, text]
      properties:
        title:
          type: string
          maxLength: 255
          example: 比赛要求
        text:
          type: string
          maxLength: 50000
          example: 请于7月30日前提交项目说明书和演示视频
    DocumentSummary:
      type: object
      required: [id, source_type, status, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        source_type:
          type: string
          enum: [pdf, text]
        title:
          type: string
          nullable: true
        file_name:
          type: string
          nullable: true
        file_url:
          type: string
          nullable: true
        page_count:
          type: integer
          format: int32
          nullable: true
        file_size:
          type: integer
          format: int64
          nullable: true
        status:
          type: string
          enum: [uploaded, ready, failed]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Document:
      type: object
      required: [id, source_type, status, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        source_type:
          type: string
          enum: [pdf, text]
        title:
          type: string
          nullable: true
        file_name:
          type: string
          nullable: true
        file_url:
          type: string
          nullable: true
        page_count:
          type: integer
          format: int32
          nullable: true
        file_size:
          type: integer
          format: int64
          nullable: true
        status:
          type: string
          enum: [uploaded, ready, failed]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        content:
          type: string
          nullable: true
    DocumentList:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DocumentSummary"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
          format: int64
    CreateParseJobRequest:
      type: object
      required: [document_id]
      properties:
        document_id:
          type: integer
          format: int64
          minimum: 1
    ParseJob:
      type: object
      required: [id, document_id, job_type, status, retry_count, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        document_id:
          type: integer
          format: int64
        job_type:
          type: string
          enum: [ai_parse]
        status:
          type: string
          enum: [pending, processing, success, failed]
        retry_count:
          type: integer
          format: int32
        error_message:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    GeneratedTask:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 2000
          nullable: true
        priority:
          type: string
          enum: [low, medium, high]
        deadline:
          type: string
          format: date-time
          nullable: true
    ParseResultFields:
      type: object
      required: [title, summary, deliverables, key_requirements, risk_warnings, generated_tasks]
      properties:
        title:
          type: string
          maxLength: 255
        summary:
          type: string
          maxLength: 5000
        deadline:
          type: string
          format: date-time
          nullable: true
        deliverables:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 1000
        key_requirements:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 1000
        risk_warnings:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 1000
        generated_tasks:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/GeneratedTask"
    UpdateParseResultRequest:
      allOf:
        - $ref: "#/components/schemas/ParseResultFields"
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              format: int32
              minimum: 1
    ParseResult:
      allOf:
        - $ref: "#/components/schemas/ParseResultFields"
        - type: object
          required: [id, document_id, parse_job_id, version, is_confirmed, created_at, updated_at]
          properties:
            id:
              type: integer
              format: int64
            document_id:
              type: integer
              format: int64
            parse_job_id:
              type: integer
              format: int64
            ai_model:
              type: string
              nullable: true
            version:
              type: integer
              format: int32
              minimum: 1
            is_confirmed:
              type: boolean
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    CreateProjectRequest:
      type: object
      required: [parse_result_id, name]
      properties:
        parse_result_id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 255
    UpdateProjectRequest:
      type: object
      required: [version, name]
      properties:
        version:
          type: integer
          format: int32
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 5000
          nullable: true
        deadline:
          type: string
          format: date-time
          nullable: true
    Project:
      type: object
      required: [id, source_document_id, parse_result_id, name, description, deadline, status, version, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        source_document_id:
          type: integer
          format: int64
        parse_result_id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
          nullable: true
        deadline:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [active, archived, deleted]
        version:
          type: integer
          format: int32
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Task:
