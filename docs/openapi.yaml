openapi: 3.0.3
info:
  title: TaskPilot Server API
  version: 0.7.0
  description: |
    TaskPilot 当前已实现接口的 OpenAPI 规范。

    说明：
    - 本文件托管在 `taskpilot-server` 仓库内，适合直接导入 Apifox 调试或通过 GitHub Raw URL 持续同步
    - 当前已实现接口统一返回响应信封 `{ code, message, data }`，错误响应的 `data` 为 `null`
    - 受保护接口支持 Bearer Token 或 `access_token` Cookie；Cookie 鉴权的写请求还必须携带与 `csrf_token` Cookie 相同的 `X-CSRF-Token`
    - `/auth/refresh` 与 `/auth/logout` 强制使用 `refresh_token` Cookie 和 CSRF Header
    - 项目、任务管理和历史只读接口已经接入；PDF 上传与用户资料修改仍未实现
    - 业务错误码：0=ok, 10001=参数无效, 10002=未授权, 10003=邮箱已注册, 10004=数据库不可用, 10005=内部错误, 10006=资源不存在, 10007=资源冲突, 10008=状态非法, 10009=请求体过大, 10010=服务不可用, 10011=禁止访问
servers:
  - url: http://localhost:8888
    description: Local development server
tags:
  - name: System
    description: 系统与示例接口
  - name: Auth
    description: 认证接口
  - name: Documents
    description: 文档录入与查询
  - name: ParseJobs
    description: 解析任务创建与状态查询
  - name: ParseResults
    description: AI 解析结果查询、编辑与确认
  - name: Projects
    description: 项目创建、查询、编辑和状态管理
  - name: Tasks
    description: 项目任务查询、编辑、状态、删除与排序
  - name: History
    description: 项目与解析结果历史只读查询
paths:
  /healthz:
    get:
      tags:
        - System
      summary: 健康检查
      description: 返回服务是否存活，以及数据库、Redis 和解析 Worker 是否就绪。
      operationId: getHealthz
      responses:
        "200":
          description: 健康检查成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
              examples:
                default:
                  value:
                    code: 0
                    message: ok
                    data:
                      status: ok
                      db: true
                      redis: true
                      worker: true
  /from/{name}:
    get:
      tags:
        - System
      summary: 示例接口
      description: 返回 `hello {name}` 的示例响应。
      operationId: getHelloFromName
      parameters:
        - name: name
          in: path
          required: true
          description: 示例名称
          schema:
            type: string
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelloEnvelope"
              examples:
                default:
                  value:
                    code: 0
                    message: ok
                    data:
                      message: hello zmk
        "500":
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                default:
                  value:
                    code: 10005
                    message: internal server error
                    data: null
  /api/v1/auth/register:
    post:
      tags:
        - Auth
      summary: 用户注册
      description: |
        注册新用户、创建 Redis Refresh 会话，并签发 JWT。

        实际行为：
        - 服务端会对邮箱执行 `trim + lower`
        - 若邮箱已存在，返回 409
        - 成功时设置 `access_token`、`refresh_token`、`csrf_token` Cookie
        - 成功时返回统一响应信封，`data` 为 `AuthResponse`
      operationId: postAuthRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            examples:
              default:
                value:
                  email: test@example.com
                  password: "12345678"
                  nickname: zmk
      responses:
        "201":
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "400":
          description: 请求参数校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                invalidRequest:
                  value:
                    code: 10001
                    message: "Key: 'RegisterRequest.Email' Error:Field validation for 'Email' failed on the 'email' tag"
                    data: null
        "409":
          description: 邮箱已注册
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                duplicatedEmail:
                  value:
                    code: 10003
                    message: email already registered
                    data: null
        "503":
          description: 数据库或 Redis Refresh 会话不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                dbUnavailable:
                  value:
                    code: 10004
                    message: database not connected
                    data: null
        "500":
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                default:
                  value:
                    code: 10005
                    message: internal server error
                    data: null
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: 用户登录
      description: |
        使用邮箱和密码登录、创建 Redis Refresh 会话，并签发 JWT。

        实际行为：
        - 服务端会对邮箱执行 `trim + lower`
        - 邮箱不存在和密码错误统一返回 401
        - 成功时设置 `access_token`、`refresh_token`、`csrf_token` Cookie
      operationId: postAuthLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              default:
                value:
                  email: test@example.com
                  password: "12345678"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "400":
          description: 请求参数校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                invalidRequest:
                  value:
                    code: 10001
                    message: "Key: 'LoginRequest.Email' Error:Field validation for 'Email' failed on the 'email' tag"
                    data: null
        "401":
          description: 邮箱或密码错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                invalidCredentials:
                  value:
                    code: 10002
                    message: invalid email or password
                    data: null
        "503":
          description: 数据库或 Redis Refresh 会话不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                dbUnavailable:
                  value:
                    code: 10004
                    message: database not connected
                    data: null
        "500":
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                default:
                  value:
                    code: 10005
                    message: internal server error
                    data: null
  /api/v1/auth/refresh:
    post:
      tags:
        - Auth
      summary: 刷新认证会话
      description: |
        原子消费并轮换当前 `refresh_token`，签发新的 Access/Refresh Cookie 与 CSRF Cookie。

        Refresh 会话使用登录时确定的绝对过期时间，刷新不会延长总期限；旧令牌重放会使当前设备会话失效。
      operationId: postAuthRefresh
      security:
        - refreshCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: 刷新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "401":
          description: Refresh Token 缺失、过期、无效或被重放
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: CSRF Cookie/Header 缺失或不匹配
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Redis Refresh 会话不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      summary: 退出当前设备
      description: |
        撤销当前设备的 Refresh 会话并清除 Access/Refresh/CSRF Cookie，不影响其他设备。

        已签发的 Access JWT 不加入黑名单，可能继续有效到其自然过期；即使 Redis 撤销失败，响应前也会清除浏览器 Cookie。
      operationId: postAuthLogout
      security:
        - refreshCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: 退出成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyEnvelope"
        "401":
          description: Refresh Token 缺失、过期或无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: CSRF Cookie/Header 缺失或不匹配
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Redis Refresh 会话不可用；Cookie 仍会被清除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/users/me:
    get:
      tags:
        - Auth
      summary: 获取当前用户
      description: |
        根据 `Authorization: Bearer <token>` 返回当前登录用户。

        实际行为：
        - `Bearer` 方案名大小写不敏感
        - token 缺失、无效、过期，或对应用户不存在时统一返回 401
      operationId: getCurrentUser
      security:
        - bearerAuth: []
        - accessCookie: []
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileEnvelope"
              examples:
                default:
                  value:
                    code: 0
                    message: ok
                    data:
                      id: 1
                      email: test@example.com
                      nickname: zmk
                      avatar_url: null
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                missingOrInvalidToken:
                  value:
                    code: 10002
                    message: invalid or missing access token
                    data: null
                userNotFound:
                  value:
                    code: 10002
                    message: invalid access token
                    data: null
        "503":
          description: 数据库未连接
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                dbUnavailable:
                  value:
                    code: 10004
                    message: database not connected
                    data: null
        "500":
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                default:
                  value:
                    code: 10005
                    message: internal server error
                    data: null
  /api/v1/documents/text:
    post:
      tags: [Documents]
      summary: 创建文本文档
      description: |
        接收用户粘贴的文本并创建文档，创建后状态为 `ready`。

        实际行为：
        - 请求体由中间件限制为最大 256 KiB，超限返回 413
        - `title` 必填且去空格后非空，`text` 必填且去空格后非空，字符数上限 50,000（按 Unicode 字符计）
        - 成功时 `data` 为 `Document`
      operationId: createTextDocument
      security:
        - bearerAuth: []
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTextDocumentRequest"
            examples:
              default:
                value:
                  title: 比赛要求
                  text: 请于7月30日前提交项目说明书和演示视频
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentEnvelope"
        "400":
          description: 请求参数无效（字段缺失或校验失败）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                invalidInput:
                  value:
                    code: 10001
                    message: invalid input
                    data: null
                bindingError:
                  value:
                    code: 10001
                    message: "Key: 'CreateTextDocumentRequest.Text' Error:Field validation for 'Text' failed on the 'required' tag"
                    data: null
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                unauthorized:
                  value:
                    code: 10002
                    message: invalid or missing access token
                    data: null
        "413":
          description: 请求体超过 256 KiB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                payloadTooLarge:
                  value:
                    code: 10009
                    message: request body too large
                    data: null
        "503":
          description: 数据库未连接
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                dbUnavailable:
                  value:
                    code: 10004
                    message: database not connected
                    data: null
        "500":
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                default:
                  value:
                    code: 10005
                    message: internal server error
                    data: null
  /api/v1/documents:
    get:
      tags: [Documents]
      summary: 分页查询当前用户文档
      description: 返回当前用户的文档列表，按 `created_at DESC, id DESC` 排序，列表项不含正文。
      operationId: listDocuments
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - name: page
          in: query
          description: 页码，从 1 开始，缺省为 1
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: page_size
          in: query
          description: 每页数量，缺省为 10
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentListEnvelope"
        "400":
          description: 分页参数无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                invalidPagination:
                  value:
                    code: 10001
                    message: "Key: 'DocumentListRequest.PageSize' Error:Field validation for 'PageSize' failed on the 'max' tag"
                    data: null
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                unauthorized:
                  value:
                    code: 10002
                    message: invalid or missing access token
                    data: null
        "503":
          description: 数据库未连接
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                dbUnavailable:
                  value:
                    code: 10004
                    message: database not connected
                    data: null
        "500":
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                default:
                  value:
                    code: 10005
                    message: internal server error
                    data: null
  /api/v1/documents/{documentId}:
    parameters:
      - name: documentId
        in: path
        required: true
        description: 文档 ID
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags: [Documents]
      summary: 查询文档详情
      description: 返回文档详情，含正文 `content`（优先取 `text_input`，其次 `raw_text`）。
      operationId: getDocument
      security:
        - bearerAuth: []
        - accessCookie: []
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentEnvelope"
        "400":
          description: 路径参数无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                invalidPathId:
                  value:
                    code: 10001
                    message: invalid input
                    data: null
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                unauthorized:
                  value:
                    code: 10002
                    message: invalid or missing access token
                    data: null
        "404":
          description: 文档不存在或不属于当前用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                notFound:
                  value:
                    code: 10006
                    message: resource not found
                    data: null
        "503":
          description: 数据库未连接
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                dbUnavailable:
                  value:
                    code: 10004
                    message: database not connected
                    data: null
        "500":
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                default:
                  value:
                    code: 10005
                    message: internal server error
                    data: null
    delete:
      tags: [Documents]
      summary: 删除文档
      description: |
        软删除文档；存在 `pending` 或 `processing` 解析任务时返回 409，已生成的解析结果、项目和任务不受影响。
      operationId: deleteDocument
      security:
        - bearerAuth: []
        - accessCookie: []
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyEnvelope"
        "400":
          description: 路径参数无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                invalidPathId:
                  value:
                    code: 10001
                    message: invalid input
                    data: null
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                unauthorized:
                  value:
                    code: 10002
                    message: invalid or missing access token
                    data: null
        "404":
          description: 文档不存在或不属于当前用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                notFound:
                  value:
                    code: 10006
                    message: resource not found
                    data: null
        "409":
          description: 文档存在待处理或处理中的解析任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                activeParseJob:
                  value:
                    code: 10007
                    message: resource conflict
                    data: null
        "503":
          description: 数据库未连接
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                dbUnavailable:
                  value:
                    code: 10004
                    message: database not connected
                    data: null
        "500":
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                default:
                  value:
                    code: 10005
                    message: internal server error
                    data: null
  /api/v1/parse-jobs:
    post:
      tags: [ParseJobs]
      summary: 创建解析任务
      description: |
        为指定文档创建解析任务。

        实际行为：
        - 文档不存在或不属于当前用户返回 404
        - 文档状态不是 `ready` 返回 422
        - 文档已存在 `pending` 或 `processing` 任务返回 409（由文档行锁和部分唯一索引共同保证）
        - 创建成功后状态固定为 `pending`，并通过 Redis 队列投递给后台 Worker 异步处理；任务成功（`status == success`）后可通过结果接口查询解析结果
      operationId: createParseJob
      security:
        - bearerAuth: []
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateParseJobRequest"
            examples:
              default:
                value:
                  document_id: 101
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseJobEnvelope"
        "400":
          description: 请求参数无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                invalidRequest:
                  value:
                    code: 10001
                    message: "Key: 'CreateParseJobRequest.DocumentID' Error:Field validation for 'DocumentID' failed on the 'required' tag"
                    data: null
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                unauthorized:
                  value:
                    code: 10002
                    message: invalid or missing access token
                    data: null
        "404":
          description: 文档不存在或不属于当前用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                documentNotFound:
                  value:
                    code: 10006
                    message: resource not found
                    data: null
        "409":
          description: 文档已有待处理或处理中的任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                activeJobExists:
                  value:
                    code: 10007
                    message: resource conflict
                    data: null
        "422":
          description: 文档状态不允许解析（需为 `ready`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                invalidState:
                  value:
                    code: 10008
                    message: invalid resource state
                    data: null
        "503":
