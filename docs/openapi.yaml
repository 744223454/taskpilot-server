  /api/v1/parse-jobs/{jobId}/retry:
    post:
      tags: [ParseJobs]
      summary: 重试失败的解析任务
      description: |
        将 `failed` 状态的解析任务重置为 `pending`，`retry_count` 自增，并清空 `error_message`、`started_at`、`finished_at`；重置后重新投递到 Redis 解析队列等待 Worker 重新处理。

        实际行为：
        - 任务不存在返回 404
        - 任务状态不是 `failed` 返回 422
        - 重置过程中触发活跃任务唯一约束时返回 409
      operationId: retryParseJob
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - name: jobId
          in: path
          required: true
          description: 解析任务 ID
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: 已重置为 pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseJobEnvelope"
        "400":
          description: 路径参数无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                invalidPathId:
                  value:
                    code: 10001
                    message: invalid input
                    data: null
        "401":
          description: 未授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                unauthorized:
                  value:
                    code: 10002
                    message: invalid or missing access token
                    data: null
        "404":
          description: 解析任务不存在或不属于当前用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                notFound:
                  value:
                    code: 10006
                    message: resource not found
                    data: null
        "409":
          description: 重置过程中触发活跃任务唯一约束
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                conflict:
                  value:
                    code: 10007
                    message: resource conflict
                    data: null
        "422":
          description: 只有 `failed` 状态可以重试
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                invalidState:
                  value:
                    code: 10008
                    message: invalid resource state
                    data: null
        "503":
          description: 数据库未连接
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                dbUnavailable:
                  value:
                    code: 10004
                    message: database not connected
                    data: null
        "500":
          description: 服务端错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                default:
                  value:
                    code: 10005
                    message: internal server error
                    data: null
